# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: she_courses
    ports:
      - "5432:5432"
    volumes:
      - she_pg:/var/lib/postgresql/data
volumes:
  she_pg:
